<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="APS 售前快速评估：从客户痛点生成 APS 价值点初稿。">
  <title>售前快速评估 · APS 实施顾问 AI 工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122521'/%3E%3Ctext x='32' y='39' font-size='17' fill='%23d9f5ef' text-anchor='middle' font-family='Arial'%3EAPS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='presales.css') }}">
</head>
<body data-page="presales" data-presales-id="{{ presales_id }}">
  <header class="topbar presales-topbar">
    <a class="brand" href="{{ url_for('page.index') }}" aria-label="返回项目总览">
      <div class="brand-mark" aria-hidden="true"><span>APS</span></div>
      <div class="brand-text">
        <div class="brand-title">APS 实施顾问 AI 工作台</div>
        <div class="brand-subtitle">售前快速评估</div>
      </div>
    </a>
    <div class="topbar-actions presales-actions">
      <button type="button" class="btn btn-outline btn-sm" id="presales-export-btn">
        <span aria-hidden="true">W</span>
        导出 Word
      </button>
      <a class="btn btn-ghost btn-sm" href="{{ url_for('page.index') }}">← 返回首页</a>
    </div>
  </header>

  <main class="presales-main">
    <section class="presales-hero">
      <span class="kicker">PRESALES QUICK ASSESSMENT</span>
      <h1>售前快速评估</h1>
      <p>这是一份 AI 初稿，用于拜访前准备；收益方向和系统能力需由顾问核实。</p>
    </section>

    <section class="presales-chat" aria-live="polite">
      <article class="presales-bubble presales-bubble--user">
        <div class="presales-bubble-head">
          <span class="presales-avatar">顾问</span>
          <span>本次评估输入</span>
        </div>
        <dl id="presales-intake" class="presales-intake"></dl>
      </article>

      <article class="presales-bubble presales-bubble--agent">
        <div class="presales-bubble-head">
          <span class="presales-avatar presales-avatar--agent">AI</span>
          <span>APS 售前助手 · 价值点初稿</span>
        </div>
        <div class="presales-assessment markdown-body" id="presales-assessment"></div>
      </article>
    </section>

    <footer class="presales-footer">
      <span>售前评估记录仅保存在本地项目数据中。</span>
      <span>AI 初稿 · 请顾问核实后使用</span>
    </footer>
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script>
    window.__PRESALES__ = {{ record | tojson }};
  </script>
  <script src="{{ url_for('static', filename='presales.js') }}" defer></script>
</body>
</html>
